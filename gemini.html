<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gemini</title>
<style>
/* Pure OLED black theme — black pixels = off pixels on S9+ panel */
:root {
  --bg:       #000000;
  --surf:     #080808;
  --surf2:    #101010;
  --surf3:    #181818;
  --border:   #222222;
  --text:     #e0e0e0;
  --dim:      #666;
  --accent:   #4f9cf0;
  --acc-dim:  #0d1f33;
  --user-bg:  #0a2540;
  --code-bg:  #000000;
  --err-bg:   #1a0808;
  --err-bd:   #3d1515;
  --err-tx:   #f87171;
  --think-bg: #05050f;
  --think-bd: #1a1a3a;
  --think-tx: #7986cb;
  --green:    #388e3c;
  --orange:   #e65100;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  /* Limit GPU layers to composited elements only */
  -webkit-font-smoothing:antialiased;
}

/* ── Header ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;background:var(--surf);border-bottom:1px solid var(--border);
  flex-shrink:0;gap:8px;min-height:52px;
}
.hl{display:flex;align-items:center;gap:8px}
header h1{font-size:16px;font-weight:600;white-space:nowrap}
.pill{
  font-size:10px;background:var(--acc-dim);color:var(--accent);
  padding:2px 7px;border-radius:20px;font-weight:600;letter-spacing:.3px;white-space:nowrap;
}
.hr{display:flex;align-items:center;gap:6px}
select.mdl{
  background:var(--surf2);border:1px solid var(--border);color:var(--text);
  padding:6px 8px;border-radius:8px;font-size:12px;font-family:inherit;outline:none;cursor:pointer;
}
.hbtn{
  background:none;border:1px solid var(--border);color:var(--dim);
  padding:6px 11px;border-radius:8px;font-size:13px;cursor:pointer;
  font-family:inherit;white-space:nowrap;
  /* No transitions on frequently tapped buttons = less GPU work */
  touch-action:manipulation;
}
.hbtn:active{background:var(--surf2);color:var(--text)}

/* ── Messages — contain paint to this region ── */
#msgs{
  flex:1;overflow-y:auto;padding:14px;
  display:flex;flex-direction:column;gap:12px;
  -webkit-overflow-scrolling:touch;
  /* Limit repaint scope to this box */
  contain:content;
  overscroll-behavior:contain;
}
.msg{display:flex;flex-direction:column;max-width:85%}
.msg.user{align-self:flex-end}
.msg.model{align-self:flex-start}
.rlbl{
  font-size:10px;color:var(--dim);margin-bottom:4px;padding:0 4px;
  font-weight:600;text-transform:uppercase;letter-spacing:.5px;
}
.msg.user .rlbl{text-align:right}
.bubble{
  padding:10px 14px;border-radius:16px;font-size:15px;
  line-height:1.65;word-break:break-word;
}
.msg.user .bubble{background:var(--user-bg);border-bottom-right-radius:4px}
.msg.model .bubble{
  background:var(--surf);border:1px solid var(--border);
  border-bottom-left-radius:4px;padding:12px 14px;
}

/* Markdown */
.bcontent p{margin-bottom:8px}.bcontent p:last-child{margin-bottom:0}
.bcontent ul,.bcontent ol{padding-left:20px;margin-bottom:8px}
.bcontent li{margin-bottom:3px}
.bcontent strong{font-weight:600;color:#fff}
.bcontent em{font-style:italic}
.bcontent h2,.bcontent h3,.bcontent h4{margin:10px 0 4px;font-weight:600}
.bcontent code{
  background:var(--surf3);padding:2px 5px;border-radius:4px;
  font-family:'Courier New',Consolas,monospace;font-size:13px;
}
.bcontent pre{
  background:var(--code-bg);border:1px solid var(--border);border-radius:10px;
  padding:11px 13px;margin:8px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;
}
.bcontent pre code{background:none;padding:0;font-size:13px;line-height:1.5}

/* Thinking block */
.thought-block{
  background:var(--think-bg);border:1px solid var(--think-bd);
  border-radius:10px;margin-bottom:10px;overflow:hidden;
}
.thought-block summary{
  padding:8px 12px;cursor:pointer;font-size:12px;
  color:var(--think-tx);font-weight:600;letter-spacing:.3px;
  user-select:none;list-style:none;display:flex;align-items:center;gap:6px;
  touch-action:manipulation;
}
.thought-block summary::-webkit-details-marker{display:none}
.thought-block summary::before{content:'▸';display:inline-block;transition:transform .15s}
.thought-block[open] summary::before{transform:rotate(90deg)}
.thought-text{
  padding:0 12px 10px;font-size:13px;color:var(--think-tx);
  line-height:1.6;max-height:200px;overflow-y:auto;white-space:pre-wrap;
}

/* Code execution */
.cexec{margin:8px 0;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.cexec-hdr{
  padding:6px 12px;font-size:11px;font-weight:600;letter-spacing:.4px;
  display:flex;align-items:center;gap:6px;
}
.cexec-hdr.code{background:#0a150a;color:#66bb6a}
.cexec-hdr.out{background:#140a00;color:#ffa726}
.cexec pre{margin:0;border:none;border-radius:0;background:var(--code-bg);padding:10px 13px}

/* Sources */
.sources{margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.sources-lbl{font-size:11px;color:var(--dim);margin-bottom:5px;font-weight:600;letter-spacing:.3px}
.source-link{
  display:block;font-size:12px;color:var(--accent);
  text-decoration:none;margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* Typing indicator — minimal animation for battery */
.typing-wrap{display:flex;flex-direction:column;align-self:flex-start;max-width:85%}
.typing{
  display:flex;align-items:center;gap:5px;padding:14px 16px;
  background:var(--surf);border:1px solid var(--border);
  border-radius:16px;border-bottom-left-radius:4px;width:fit-content;
}
.dot{
  width:6px;height:6px;background:var(--dim);border-radius:50%;
  /* will-change tells the browser to keep this on its own layer — avoids repainting the whole page */
  will-change:transform,opacity;
  animation:bounce 1.4s ease-in-out infinite;
}
.dot:nth-child(2){animation-delay:.22s}
.dot:nth-child(3){animation-delay:.44s}
@keyframes bounce{
  0%,55%,100%{transform:translateY(0);opacity:.35}
  27%{transform:translateY(-5px);opacity:1}
}

/* Error */
.err-msg{
  background:var(--err-bg);border:1px solid var(--err-bd);color:var(--err-tx);
  padding:9px 13px;border-radius:12px;font-size:14px;align-self:center;max-width:90%;
}

/* Empty state */
.empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--dim);gap:10px;text-align:center;padding:32px;pointer-events:none;
}
.empty h2{font-size:20px;font-weight:600;color:var(--text);margin-top:4px}
.empty p{font-size:13px;line-height:1.6;max-width:240px}

/* ── Toolbar ── */
.toolbar{
  display:flex;align-items:center;gap:6px;
  padding:8px 14px;background:var(--surf);border-top:1px solid var(--border);
  flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.toolbar::-webkit-scrollbar{display:none}
.tbtn{
  display:flex;align-items:center;gap:5px;white-space:nowrap;
  background:var(--surf2);border:1px solid var(--border);color:var(--dim);
  padding:6px 12px;border-radius:20px;font-size:12px;font-weight:500;
  cursor:pointer;font-family:inherit;flex-shrink:0;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.tbtn.on{background:var(--acc-dim);border-color:var(--accent);color:var(--accent)}
.tbtn:active{opacity:.7}
.tbtn svg{width:13px;height:13px;flex-shrink:0}
.think-lbl{font-size:10px;opacity:.7;margin-left:2px}

/* ── Image previews ── */
#img-strip{
  display:none;flex-wrap:wrap;gap:6px;
  padding:6px 14px;background:var(--surf);border-top:1px solid var(--border);
  flex-shrink:0;
}
.img-thumb{position:relative;width:56px;height:56px;flex-shrink:0}
.img-thumb img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
.img-rm{
  position:absolute;top:-5px;right:-5px;background:var(--surf3);border:1px solid var(--border);
  color:var(--dim);width:18px;height:18px;border-radius:50%;font-size:11px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  touch-action:manipulation;
}

/* ── Input ── */
.input-row{
  padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));
  background:var(--surf);border-top:1px solid var(--border);
  display:flex;gap:8px;align-items:flex-end;flex-shrink:0;
}
#input{
  flex:1;background:var(--surf2);border:1px solid var(--border);color:var(--text);
  padding:10px 13px;border-radius:14px;font-size:15px;font-family:inherit;
  resize:none;min-height:44px;max-height:180px;outline:none;line-height:1.5;
  -webkit-appearance:none;
}
#input:focus{border-color:var(--accent)}
#input::placeholder{color:var(--dim)}
#send{
  background:var(--accent);border:none;color:#fff;width:44px;height:44px;
  border-radius:13px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
#send:disabled{opacity:.3;cursor:not-allowed}
#send:active{transform:scale(.91)}

/* ── Settings overlay — no backdrop-filter (GPU intensive) ── */
.overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.92);  /* solid dark instead of blur = no GPU composite layer */
  z-index:200;align-items:flex-start;justify-content:center;
  padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.overlay.open{display:flex}
.sbox{
  background:var(--surf);border:1px solid var(--border);border-radius:18px;
  padding:20px;width:100%;max-width:460px;margin:auto;display:flex;flex-direction:column;gap:14px;
}
.sbox h2{font-size:16px;font-weight:600}
.sfield{display:flex;flex-direction:column;gap:6px}
.sfield label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.sfield input,.sfield select,.sfield textarea{
  background:var(--surf2);border:1px solid var(--border);color:var(--text);
  padding:10px 12px;border-radius:10px;font-size:14px;font-family:inherit;outline:none;
}
.sfield input:focus,.sfield textarea:focus{border-color:var(--accent)}
.sfield select{cursor:pointer}
.sfield textarea{resize:vertical;min-height:70px;line-height:1.5}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.srow label{font-size:14px;cursor:pointer;user-select:none}
/* Toggle — CSS only, no JS animation cost */
.toggle{
  width:42px;height:24px;background:var(--surf3);border:1px solid var(--border);
  border-radius:12px;cursor:pointer;position:relative;touch-action:manipulation;
}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle::after{
  content:'';position:absolute;width:18px;height:18px;background:#fff;
  border-radius:50%;top:2px;left:2px;
  transition:transform .15s;  /* short — fast enough, low cost */
  will-change:transform;
}
.toggle.on::after{transform:translateX(18px)}
input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer;height:4px}
.sbtns{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.btn{
  padding:9px 18px;border-radius:10px;font-size:14px;font-weight:500;
  cursor:pointer;border:none;font-family:inherit;touch-action:manipulation;
}
.btn:active{opacity:.75}
.btn-p{background:var(--accent);color:#fff}
.btn-s{background:var(--surf2);color:var(--text);border:1px solid var(--border)}
.sdiv{height:1px;background:var(--border)}
.snote{font-size:12px;color:var(--dim);line-height:1.6}
</style>
</head>
<body>

<header>
  <div class="hl">
    <h1>Gemini</h1>
    <span class="pill" id="pill">Flash</span>
  </div>
  <div class="hr">
    <select class="mdl" id="mdl-sel" onchange="changeModel(this.value)">
      <optgroup label="Latest">
        <option value="gemini-flash-latest">Flash Latest</option>
        <option value="gemini-pro-latest">Pro Latest</option>
        <option value="gemini-flash-lite-latest">Lite Latest</option>
      </optgroup>
      <optgroup label="Gemini 3">
        <option value="gemini-3.1-pro-preview">Pro 3.1</option>
        <option value="gemini-3-flash-preview">Flash 3</option>
        <option value="gemini-3.1-flash-lite">Lite 3.1</option>
      </optgroup>
    </select>
    <button class="hbtn" onclick="clearChat()">Clear</button>
    <button class="hbtn" onclick="openSettings()">⚙</button>
  </div>
</header>

<div id="msgs">
  <div class="empty" id="empty">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" opacity=".15">
      <circle cx="22" cy="22" r="19" stroke="#aaa" stroke-width="2"/>
      <path d="M12 22h20M22 12v20" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h2>Gemini</h2>
    <p>Toggle tools below, then start chatting</p>
  </div>
</div>

<div class="toolbar">
  <button class="tbtn" id="btn-search" onclick="toggleTool('search')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    Search
  </button>
  <button class="tbtn" id="btn-url" onclick="toggleTool('url')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
    </svg>
    URL
  </button>
  <button class="tbtn" id="btn-code" onclick="toggleTool('code')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
    </svg>
    Code
  </button>
  <button class="tbtn" id="btn-think" onclick="cycleThinking()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M12 2a7 7 0 0 1 7 7c0 2.5-1.3 4.7-3.3 6l-.7 3H9l-.7-3A7 7 0 0 1 5 9a7 7 0 0 1 7-7z"/>
      <path d="M9 21h6"/><path d="M9 18h6"/>
    </svg>
    Think <span class="think-lbl" id="think-lbl">Off</span>
  </button>
  <label class="tbtn" for="img-in">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
    Image
  </label>
  <input type="file" id="img-in" accept="image/*" multiple style="display:none" onchange="addImages(this)">
</div>

<div id="img-strip"></div>

<div class="input-row">
  <textarea id="input" placeholder="Message…" rows="1"
    onkeydown="onKey(event)" oninput="resizeInput(this)"></textarea>
  <button id="send" onclick="send()">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
      <path d="M9 15V3M9 3L4 8M9 3l5 5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<div class="overlay" id="overlay" onclick="bgClick(event)">
  <div class="sbox">
    <h2>Settings</h2>
    <div class="sfield">
      <label>API Key</label>
      <input type="password" id="s-key" placeholder="AIza… or AQ.…">
    </div>
    <div class="sfield">
      <label>System Instruction</label>
      <textarea id="s-sys" placeholder="Optional: persona, role, constraints…"></textarea>
    </div>
    <div class="sdiv"></div>
    <div class="sfield">
      <label>Default Model</label>
      <select id="s-mdl">
        <optgroup label="Latest">
          <option value="gemini-flash-latest">Flash Latest</option>
          <option value="gemini-pro-latest">Pro Latest</option>
          <option value="gemini-flash-lite-latest">Lite Latest</option>
        </optgroup>
        <optgroup label="Gemini 3">
          <option value="gemini-3.1-pro-preview">Pro 3.1</option>
          <option value="gemini-3-flash-preview">Flash 3</option>
          <option value="gemini-3.1-flash-lite">Lite 3.1</option>
        </optgroup>
      </select>
    </div>
    <div class="sfield">
      <label>Temperature — <span id="s-temp-val" style="color:var(--accent)">0.7</span></label>
      <input type="range" id="s-temp" min="0" max="2" step="0.05" value="0.7"
        oninput="document.getElementById('s-temp-val').textContent=parseFloat(this.value).toFixed(2)">
    </div>
    <div class="sfield">
      <label>Max Output Tokens</label>
      <input type="number" id="s-tok" value="8192" min="256" max="65536" step="256">
    </div>
    <div class="sdiv"></div>
    <div class="srow">
      <label>JSON Mode</label>
      <div class="toggle" id="t-json" onclick="toggleSetting('json')"></div>
    </div>
    <div class="srow">
      <label>Relax Safety Filters</label>
      <div class="toggle" id="t-safety" onclick="toggleSetting('safety')"></div>
    </div>
    <div class="sdiv"></div>
    <p class="snote">
      Search &amp; URL — not supported on Lite models<br>
      Thinking — Flash 3, Pro 3.1, 2.5 series only<br>
      Regenerate your API key after sharing it publicly
    </p>
    <div class="sbtns">
      <button class="btn btn-s" onclick="closeSettings()">Cancel</button>
      <button class="btn btn-p" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<script>
// ══ STATE ═══════════════════════════════════════
let API_KEY  = '';
let MODEL    = 'gemini-flash-latest';
let history  = [];
let busy     = false;
let pendingImgs = [];

let tools = { search:false, url:false, code:false };

const THINK_STEPS = [0, 1024, 8192, 24576];
const THINK_LBLS  = ['Off','Low','Med','High'];
let thinkIdx = 0;

let CFG = { sys:'', temp:0.7, tokens:8192, json:false, safety:false };

// ── Persist ──────────────────────────────────────
(function load(){
  try {
    const s = JSON.parse(localStorage.getItem('gcfg3') || '{}');
    if (s.k)  API_KEY  = s.k;
    if (s.m)  MODEL    = s.m;
    if (s.cfg) Object.assign(CFG, s.cfg);
    if (s.tools) Object.assign(tools, s.tools);
    if (typeof s.ti === 'number') thinkIdx = s.ti;
  } catch(_){}
  syncUI();
})();

function persist(){
  try{ localStorage.setItem('gcfg3', JSON.stringify({k:API_KEY,m:MODEL,cfg:CFG,tools,ti:thinkIdx})); }catch(_){}
}

function syncUI(){
  document.getElementById('mdl-sel').value = MODEL;
  document.getElementById('pill').textContent = pillLabel(MODEL);
  for(const[k,v] of Object.entries(tools))
    document.getElementById(`btn-${k}`).classList.toggle('on',v);
  document.getElementById('btn-think').classList.toggle('on', thinkIdx>0);
  document.getElementById('think-lbl').textContent = THINK_LBLS[thinkIdx];
}

function pillLabel(m){
  return m.includes('lite')?'Lite':m.includes('pro')?'Pro':'Flash';
}

// ══ TOOLS ════════════════════════════════════════
function toggleTool(name){
  tools[name] = !tools[name];
  document.getElementById(`btn-${name}`).classList.toggle('on', tools[name]);
  persist();
}

function cycleThinking(){
  thinkIdx = (thinkIdx+1) % THINK_STEPS.length;
  document.getElementById('btn-think').classList.toggle('on', thinkIdx>0);
  document.getElementById('think-lbl').textContent = THINK_LBLS[thinkIdx];
  persist();
}

function changeModel(v){
  MODEL = v;
  document.getElementById('pill').textContent = pillLabel(v);
  persist();
}

// ══ IMAGES ═══════════════════════════════════════
function addImages(input){
  Array.from(input.files).forEach(file=>{
    const r = new FileReader();
    r.onload = e => {
      pendingImgs.push({ mimeType:file.type, data:e.target.result.split(',')[1] });
      renderStrip();
    };
    r.readAsDataURL(file);
  });
  input.value='';
}
function removeImg(i){ pendingImgs.splice(i,1); renderStrip(); }
function renderStrip(){
  const s = document.getElementById('img-strip');
  if(!pendingImgs.length){ s.style.display='none'; s.innerHTML=''; return; }
  s.style.display='flex';
  s.innerHTML = pendingImgs.map((img,i)=>
    `<div class="img-thumb"><img src="data:${img.mimeType};base64,${img.data}">
     <div class="img-rm" onclick="removeImg(${i})">×</div></div>`
  ).join('');
}

// ══ REQUEST ══════════════════════════════════════
function buildRequest(){
  const req = {
    contents: history,
    generationConfig:{ temperature:CFG.temp, maxOutputTokens:CFG.tokens }
  };
  if(CFG.sys.trim())
    req.systemInstruction = { parts:[{text:CFG.sys.trim()}] };

  const tl = [];
  if(tools.search) tl.push({googleSearch:{}});
  if(tools.url)    tl.push({urlContext:{}});
  if(tools.code)   tl.push({codeExecution:{}});
  if(tl.length) req.tools = tl;

  const budget = THINK_STEPS[thinkIdx];
  if(budget>0) req.generationConfig.thinkingConfig = { thinkingBudget:budget, includeThoughts:true };

  if(CFG.json) req.generationConfig.responseMimeType = 'application/json';

  if(CFG.safety) req.safetySettings =
    ['HARM_CATEGORY_HARASSMENT','HARM_CATEGORY_HATE_SPEECH',
     'HARM_CATEGORY_SEXUALLY_EXPLICIT','HARM_CATEGORY_DANGEROUS_CONTENT']
    .map(cat=>({category:cat, threshold:'BLOCK_NONE'}));

  return req;
}

// ══ SEND ═════════════════════════════════════════
async function send(){
  if(busy) return;
  const inp  = document.getElementById('input');
  const text = inp.value.trim();
  if(!text && !pendingImgs.length) return;

  inp.value=''; resizeInput(inp); setBusy(true);

  const userParts = [];
  if(text) userParts.push({text});
  pendingImgs.forEach(img=>userParts.push({inlineData:{mimeType:img.mimeType,data:img.data}}));
  pendingImgs=[]; renderStrip();

  history.push({role:'user', parts:userParts});
  appendUserMsg(userParts);
  showTyping();

  try {
    const { modelParts } = await streamResponse();
    removeTyping();
    if(modelParts.length) history.push({role:'model', parts:modelParts});
  } catch(e){
    removeTyping();
    showError(e.message||'Network error');
    history.pop();
  }
  setBusy(false);
  document.getElementById('input').focus();
}

// ══ STREAM ═══════════════════════════════════════
// Battery optimisation: DOM writes are batched via requestAnimationFrame.
// Instead of touching the DOM every SSE chunk (can be 20+ per second),
// we queue updates and flush once per frame (~60fps cap, GPU already woken for display).
let _rafId = null;
let _rafText = '';
let _rafEl = null;

function scheduleTextUpdate(el, text){
  _rafEl = el; _rafText = text;
  if(!_rafId) _rafId = requestAnimationFrame(()=>{
    if(_rafEl) _rafEl.textContent = _rafText;
    _rafId = null;
  });
}

let _thoughtRafId = null;
let _thoughtText  = '';
let _thoughtEl    = null;

function scheduleThoughtUpdate(el, text){
  _thoughtEl = el; _thoughtText = text;
  if(!_thoughtRafId) _thoughtRafId = requestAnimationFrame(()=>{
    if(_thoughtEl) _thoughtEl.textContent = _thoughtText;
    _thoughtRafId = null;
  });
}

async function streamResponse(){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:streamGenerateContent?alt=sse&key=${API_KEY}`;
  const res = await fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(buildRequest()),
  });
  if(!res.ok){
    const err = await res.json().catch(()=>({}));
    throw new Error(err?.error?.message||`HTTP ${res.status}`);
  }

  const { wrap, contentEl, thoughtSummaryEl, thoughtTextEl } = createStreamBubble();

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf='', fullText='', thoughtAcc='', sources=[], codeParts=[], modelParts=[];

  // Reset RAF state for this response
  _rafEl=null; _thoughtEl=null;

  while(true){
    const {done,value} = await reader.read();
    if(done) break;

    buf += dec.decode(value,{stream:true});
    const lines = buf.split('\n');
    buf = lines.pop();

    for(const line of lines){
      if(!line.startsWith('data: ')) continue;
      const raw = line.slice(6).trim();
      if(!raw||raw==='[DONE]') continue;
      let chunk; try{ chunk=JSON.parse(raw); }catch{ continue; }

      const candidate = chunk.candidates?.[0];
      if(!candidate) continue;

      for(const part of candidate.content?.parts??[]){
        if(part.thought && part.text){
          thoughtAcc += part.text;
          thoughtSummaryEl.closest('details').style.display='';
          thoughtSummaryEl.closest('details').open=true;
          scheduleThoughtUpdate(thoughtTextEl, thoughtAcc);
        } else if(part.text){
          fullText += part.text;
          scheduleTextUpdate(contentEl, fullText);  // batched — no per-chunk DOM write
          modelParts.push({text:part.text});
        } else if(part.executableCode){
          codeParts.push({type:'code', lang:part.executableCode.language||'python', code:part.executableCode.code});
        } else if(part.codeExecutionResult){
          codeParts.push({type:'result', outcome:part.codeExecutionResult.outcome, output:part.codeExecutionResult.output||''});
        }
      }

      // Grounding
      const gm = candidate.groundingMetadata;
      if(gm?.groundingChunks){
        sources = gm.groundingChunks.filter(c=>c.web?.uri)
          .map(c=>({title:c.web.title||c.web.uri, uri:c.web.uri}));
      }
    }
  }

  // Cancel any pending RAF and do final writes synchronously
  if(_rafId){ cancelAnimationFrame(_rafId); _rafId=null; }
  if(_thoughtRafId){ cancelAnimationFrame(_thoughtRafId); _thoughtRafId=null; }

  // Final markdown render (replaces plain text)
  if(fullText) contentEl.innerHTML = md(fullText);

  // Code execution blocks
  const bub = wrap.querySelector('.bubble');
  codeParts.forEach(cp=>{
    const div=document.createElement('div'); div.className='cexec';
    if(cp.type==='code')
      div.innerHTML=`<div class="cexec-hdr code">▶ ${cp.lang}</div><pre><code>${esc(cp.code)}</code></pre>`;
    else
      div.innerHTML=`<div class="cexec-hdr out">${cp.outcome==='OUTCOME_OK'?'✓':'✗'} Output</div><pre><code>${esc(cp.output)}</code></pre>`;
    bub.appendChild(div);
  });

  // Sources
  if(sources.length){
    const sd=document.createElement('div'); sd.className='sources';
    sd.innerHTML='<div class="sources-lbl">SOURCES</div>'+
      sources.map(s=>`<a class="source-link" href="${s.uri}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join('');
    bub.appendChild(sd);
  }

  // Collapse thinking when done
  const tb = wrap.querySelector('.thought-block');
  if(tb && thoughtAcc) tb.open=false;

  scrollBottom();
  return { modelParts };
}

// ══ DOM HELPERS ═══════════════════════════════════
function removeEmpty(){ document.getElementById('empty')?.remove(); }
function scrollBottom(){ const m=document.getElementById('msgs'); m.scrollTop=m.scrollHeight; }
function setBusy(v){ busy=v; document.getElementById('send').disabled=v; }

function appendUserMsg(parts){
  removeEmpty();
  const m=document.getElementById('msgs');
  const wrap=document.createElement('div'); wrap.className='msg user';
  const lbl=document.createElement('div'); lbl.className='rlbl'; lbl.textContent='You';
  const bub=document.createElement('div'); bub.className='bubble';
  parts.forEach(p=>{
    if(p.text){ const t=document.createElement('div'); t.textContent=p.text; bub.appendChild(t); }
    if(p.inlineData){
      const img=document.createElement('img');
      img.src=`data:${p.inlineData.mimeType};base64,${p.inlineData.data}`;
      img.style.cssText='max-width:100%;border-radius:8px;margin-top:6px;display:block';
      bub.appendChild(img);
    }
  });
  wrap.appendChild(lbl); wrap.appendChild(bub); m.appendChild(wrap); scrollBottom();
}

function createStreamBubble(){
  removeEmpty();
  const m=document.getElementById('msgs');
  const wrap=document.createElement('div'); wrap.className='msg model';
  const lbl=document.createElement('div'); lbl.className='rlbl'; lbl.textContent='Gemini';
  const bub=document.createElement('div'); bub.className='bubble';

  const thinkEl=document.createElement('details');
  thinkEl.className='thought-block'; thinkEl.style.display='none';
  const sumEl=document.createElement('summary'); sumEl.textContent='Thinking…';
  const tTextEl=document.createElement('div'); tTextEl.className='thought-text';
  thinkEl.appendChild(sumEl); thinkEl.appendChild(tTextEl);

  const contentEl=document.createElement('div'); contentEl.className='bcontent';

  bub.appendChild(thinkEl); bub.appendChild(contentEl);
  wrap.appendChild(lbl); wrap.appendChild(bub); m.appendChild(wrap);
  scrollBottom();
  return { wrap, contentEl, thoughtSummaryEl:sumEl, thoughtTextEl:tTextEl };
}

function showTyping(){
  removeEmpty();
  const m=document.getElementById('msgs');
  const wrap=document.createElement('div'); wrap.className='typing-wrap'; wrap.id='typing';
  const lbl=document.createElement('div'); lbl.className='rlbl'; lbl.textContent='Gemini';
  const t=document.createElement('div'); t.className='typing';
  t.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  wrap.appendChild(lbl); wrap.appendChild(t); m.appendChild(wrap); scrollBottom();
}
function removeTyping(){ document.getElementById('typing')?.remove(); }

function showError(msg){
  removeTyping();
  const m=document.getElementById('msgs');
  const div=document.createElement('div'); div.className='err-msg';
  div.textContent=`Error: ${msg}`; m.appendChild(div); scrollBottom();
}

function clearChat(){
  history=[];
  document.getElementById('msgs').innerHTML=`<div class="empty" id="empty">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" opacity=".15">
      <circle cx="22" cy="22" r="19" stroke="#aaa" stroke-width="2"/>
      <path d="M12 22h20M22 12v20" stroke="#aaa" stroke-width="2" stroke-linecap="round"/>
    </svg><h2>Gemini</h2><p>Toggle tools below, then start chatting</p></div>`;
}

// ══ MARKDOWN ══════════════════════════════════════
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function md(text){
  let s=esc(text);
  const blocks=[];
  s=s.replace(/```([\w]*)\n?([\s\S]*?)```/g,(_,lang,code)=>{
    const i=blocks.length;
    blocks.push(`<pre><code>${code.trim()}</code></pre>`);
    return `\x00B${i}\x00`;
  });
  s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/\*(.+?)\*/g,'<em>$1</em>');
  s=s.replace(/^#{1,4} (.+)$/gm,(_,t,o)=>{
    const lvl={1:'h2',2:'h3',3:'h4',4:'h4'}[_.match(/^#+/)[0].length]||'h4';
    return `<${lvl}>${t}</${lvl}>`;
  });
  s=s.replace(/((?:^[\*\-] .+\n?)+)/gm,m=>{
    const items=m.trim().split('\n').map(l=>`<li>${l.replace(/^[\*\-] /,'')}</li>`).join('');
    return `<ul>${items}</ul>`;
  });
  s=s.replace(/((?:^\d+\. .+\n?)+)/gm,m=>{
    const items=m.trim().split('\n').map(l=>`<li>${l.replace(/^\d+\. /,'')}</li>`).join('');
    return `<ol>${items}</ol>`;
  });
  s=s.split(/\n{2,}/).map(p=>{
    p=p.trim(); if(!p) return '';
    if(p.startsWith('<')) return p;
    return `<p>${p.replace(/\n/g,'<br>')}</p>`;
  }).join('');
  s=s.replace(/\x00B(\d+)\x00/g,(_,i)=>blocks[i]);
  return s;
}

// ══ SETTINGS ══════════════════════════════════════
function openSettings(){
  document.getElementById('s-key').value=API_KEY;
  document.getElementById('s-sys').value=CFG.sys;
  document.getElementById('s-mdl').value=MODEL;
  document.getElementById('s-temp').value=CFG.temp;
  document.getElementById('s-temp-val').textContent=parseFloat(CFG.temp).toFixed(2);
  document.getElementById('s-tok').value=CFG.tokens;
  document.getElementById('t-json').classList.toggle('on',CFG.json);
  document.getElementById('t-safety').classList.toggle('on',CFG.safety);
  document.getElementById('overlay').classList.add('open');
}
function closeSettings(){ document.getElementById('overlay').classList.remove('open'); }
function saveSettings(){
  const k=document.getElementById('s-key').value.trim();
  if(k) API_KEY=k;
  MODEL      = document.getElementById('s-mdl').value;
  CFG.sys    = document.getElementById('s-sys').value;
  CFG.temp   = parseFloat(document.getElementById('s-temp').value);
  CFG.tokens = parseInt(document.getElementById('s-tok').value)||8192;
  CFG.json   = document.getElementById('t-json').classList.contains('on');
  CFG.safety = document.getElementById('t-safety').classList.contains('on');
  syncUI(); persist(); closeSettings();
}
function toggleSetting(id){ document.getElementById(`t-${id}`).classList.toggle('on'); }
function bgClick(e){ if(e.target===document.getElementById('overlay')) closeSettings(); }

// ══ INPUT ══════════════════════════════════════════
function onKey(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } }
function resizeInput(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,180)+'px'; }

// Passive scroll listener — tells browser no preventDefault() coming, skips scroll-blocking check
document.getElementById('msgs').addEventListener('scroll', ()=>{}, {passive:true});
</script>
